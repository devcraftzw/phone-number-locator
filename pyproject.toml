[project]
name = "phone-number-locator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sean Craig Dhlamini", email = "devcraftzw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "ipykernel>=7.3.0",
